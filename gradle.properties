GROUP=io.mehow.laboratory
VERSION_NAME=3.0.0-SNAPSHOT

POM_DESCRIPTION=Library for feature flags management.

POM_URL=https://github.com/vudzkostek/laboratory
POM_SCM_URL=https://github.com/vudzkostek/laboratory
POM_SCM_CONNECTION=scm:git:git://github.com/vudzkostek/laboratory.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/vudzkostek/laboratory.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=vudzkostek
POM_DEVELOPER_NAME=Artur Kosta

# Increase the build VMs heap size. Default is 512m.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Kotlin/Native release-framework linking performs DevirtualizationAnalysis that OOMs with the
# default heap; bump it to 4 GiB to match the Gradle daemon.
kotlin.native.jvmArgs=-Xmx4g

android.useAndroidX=true
