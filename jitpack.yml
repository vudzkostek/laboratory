jdk:
  - openjdk21

install:
  # JitPack builds on Linux. We publish per-target artifacts (JVM, Android, iOS klibs) to the local
  # Maven repository and JitPack re-serves them under com.github.vudzkostek.laboratory:*:<tag>.
  # Spotless + tests + binary-compat-validator run in CI (quality_check.yml); JitPack only publishes.
  - ./gradlew publishToMavenLocal --no-configuration-cache -x check -x test -x spotlessCheck -x apiCheck

before_install:
  - sdk install java 21.0.4-zulu
